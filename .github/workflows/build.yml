# Builds the Everybody's Golf runner from source on Windows (MSYS2 CLANG64, as docs/building.md) and Linux,
# runs the tests and packages each release (stripped, what players get), its symbols and the debug
# release as the run's artifacts. FFmpeg comes from prebuilt/ (tools/build_ffmpeg.sh), built only when
# that archive is out of date. linux-smoke unpacks the Linux release on other distros. A v* tag publishes
# the player packages as a GitHub release once every job has passed, with the tag's section of
# CHANGELOG.md as its text (tools/release_notes.py).
name: build

on:
  # Releases only: pushes to branches do not build.
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # v* tags: the tag's section of CHANGELOG.md, checked at once rather than after the builds.
  notes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            tools/release_notes.py
          sparse-checkout-cone-mode: false
      - name: Release notes
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME"

  windows:
    runs-on: windows-latest
    outputs:
      release: ${{ steps.package.outputs.release }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe names the release
      # The submodules at their pinned commits only, not their whole history.
      - name: Submodules
        run: git submodule update --init --recursive --depth 1 --jobs 4

      # The runner's own MSYS2 at C:\msys64, where build.sh and package.py look.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          # The runner image's MSYS2 and the packages below as they come, without a full pacman -Syu.
          update: false
          install: git patch make
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p zlib:p zydis:p nasm:p
            spirv-tools:p spirv-headers:p spirv-cross:p

      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      # A crashing test exits instead of waiting on a Windows Error Reporting dialog.
      - name: No crash dialogs
        shell: pwsh
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DontShowUI -Value 1 -Type DWord

      # A hung test still fails here instead of stalling the job.
      # A v* tag builds as that version (GOLF_VERSION), which the launcher's update check compares.
      - name: Build and run the runtime tests
        timeout-minutes: 60
        env:
          GOLF_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: bash build.sh --test

      # The GPU tests write to out/<test>.log: the end of each, so a hang shows where it stopped.
      - name: Test logs (failed run)
        if: failure()
        run: for f in out/*-test.log; do [[ -f $f ]] && { echo "== $f"; tail -n 15 "$f"; }; done; true

      - name: Python tests
        run: cd tests && python -m unittest discover -p "test_*.py"

      - name: Package
        id: package
        env:
          GOLF_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          python tools/package.py --zip ${GOLF_VERSION:+--version "$GOLF_VERSION"}
          python tools/package.py --zip --debug --out dist-debug ${GOLF_VERSION:+--version "$GOLF_VERSION"}
          echo "RELEASE=$(cat dist/release.txt)-windows-x64" >> "$GITHUB_ENV"
          echo "release=$(cat dist/release.txt)-windows-x64" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE }}
          path: |
            out/${{ env.RELEASE }}.zip
            out/${{ env.RELEASE }}.zip.sha256
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE }}-debug
          path: out/${{ env.RELEASE }}-debug.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE }}-symbols
          path: out/${{ env.RELEASE }}-symbols.zip
          compression-level: 0

  # Linux: built on Ubuntu 24.04 so it starts on glibc 2.39 or newer (SteamOS, Fedora/Bazzite,
  # Debian 13, Ubuntu 24.04+). The player AppImage and tarball share one artifact.
  linux:
    runs-on: ubuntu-24.04
    env:
      SDL_AUDIO_DRIVER: dummy
      CC: clang-18
      CXX: clang++-18
    outputs:
      release: ${{ steps.package.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe names the release
      # The submodules at their pinned commits only, not their whole history.
      - name: Submodules
        run: git submodule update --init --recursive --depth 1 --jobs 4

      - name: Dependencies
        run: bash .github/scripts/ci-deps.sh

      - name: Build and run the runtime tests
        timeout-minutes: 60
        run: bash build.sh --test

      - name: Test logs (failed run)
        if: failure()
        run: for f in out/*-test.log; do [[ -f $f ]] && { echo "== $f"; tail -n 15 "$f"; }; done; true

      - name: Every compile error (failed build)
        if: failure()
        run: ninja -C out/gpu -k 0 resogun 2>&1 | grep -E -A4 'error:|undefined reference' | head -400

      - name: Python tests
        run: cd tests && python3 -m unittest discover -p "test_*.py"

      - name: AppImage tooling
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          printf '%s  %s\n' \
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 "$RUNNER_TEMP/appimagetool" \
            2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d "$RUNNER_TEMP/runtime-x86_64" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Package
        id: package
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          export APPIMAGE_RUNTIME_FILE="$RUNNER_TEMP/runtime-x86_64"
          python3 tools/package.py --appimage
          python3 tools/package.py --zip --debug --out dist-debug
          release=$(cat dist/release.txt)
          image="out/${release}-linux-x86_64.AppImage"
          test -s "out/${release}-linux.tar.gz"
          test -s "$image"
          "$image" "$RUNNER_TEMP/golf data" --version | grep -F "Everybody's Golf"
          "$image" "$RUNNER_TEMP/golf data" --guest-arg --data-dir --version | grep -F "Everybody's Golf"
          "$image" "$RUNNER_TEMP/golf data" --shortcut "$RUNNER_TEMP/golf shortcuts"
          grep -Fx "Exec=\"$(realpath "$image")\" \"$RUNNER_TEMP/golf data\"" \
            "$RUNNER_TEMP/golf shortcuts/everybodys-golf.desktop"
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE }}-linux
          path: |
            out/${{ env.RELEASE }}-linux.tar.gz
            out/${{ env.RELEASE }}-linux-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE }}-linux-debug
          path: out/${{ env.RELEASE }}-linux-debug.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE }}-linux-symbols
          path: out/${{ env.RELEASE }}-linux-symbols.tar.gz
          compression-level: 0

  # Check the unpacked Linux binary and portable CLI on other distros without a game dump.
  linux-smoke:
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # debian:13 has SteamOS 3.7's glibc (2.41), fedora:42 is Bazzite's base; ubuntu:24.04 without
        # the build's packages.
        image: ['ubuntu:24.04', 'debian:13', 'fedora:42', 'archlinux:latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux.outputs.release }}-linux
          path: out
      - name: ${{ matrix.image }}
        run: |
          mkdir -p unpacked && tar -xzf out/*-linux.tar.gz -C unpacked
          docker run --rm -v "$PWD:/w" "${{ matrix.image }}" \
            bash /w/.github/scripts/smoke-test.sh "/w/unpacked/${{ needs.linux.outputs.release }}"

  # v* tags: the release, with what players download and nothing else (no symbols or debug builds).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [notes, windows, linux, linux-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            tools/release_notes.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.release }}
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux.outputs.release }}-linux
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS: ${{ needs.windows.outputs.release }}
          LINUX: ${{ needs.linux.outputs.release }}
        # The tag's CHANGELOG.md section, then how to install.
        run: |
          {
            python3 tools/release_notes.py "$GITHUB_REF_NAME"
            echo
            echo "## Install"
            echo
            echo "On Windows, unzip ${WINDOWS}.zip and run EverybodysGolf.exe."
            echo "On Linux, extract ${LINUX}-linux.tar.gz and run everybodys-golf, or run ${LINUX}-linux-x86_64.AppImage with a data directory as its first argument."
            echo "Use a merged, decrypted dump of CUSA04687 update 1.17. See README.txt."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md "out/${WINDOWS}.zip" "out/${WINDOWS}.zip.sha256" "out/${LINUX}-linux.tar.gz" "out/${LINUX}-linux-x86_64.AppImage"

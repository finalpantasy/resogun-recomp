# Copy to settings.ini and change what you need. Environment variables in parentheses override a key.
# A settings.ini in the save folder is read instead of the one next to the game; the in-game pages
# save there. EverybodysGolf.exe (the launcher) edits data\save\settings.ini on its Display,
# Graphics and Sound & controls tabs.
# Window: windowed, borderless (covers the screen at the desktop resolution) or fullscreen
# (EG_DISPLAY_MODE).
display_mode=borderless
# Output aspect ratio (EG_ASPECT_RATIO). Keep 16:9: Everybody's Golf draws a 16:9 picture, and the
# wider-picture patch the runtime has is for another game's code, so other ratios only add black bars.
aspect_ratio=16:9
# Windowed resolution, WIDTHxHEIGHT: the window's size, of the aspect ratio (another shape moves to the
# size of that ratio nearest in height) (EG_OUTPUT_RESOLUTION). The fullscreen modes pick their
# own: borderless the desktop, fullscreen the largest screen mode of the ratio (else the desktop's),
# with black bars when the screen is of another shape. The game's picture is filtered to it.
output_resolution=1920x1080
# Display index the window opens on, empty for the primary (EG_MONITOR). 0 is the first display
# Windows lists, which is not always the primary.
monitor=
# VSync (EG_VSYNC): 1 waits for the monitor; 0 shows the newest frame at each refresh,
# still without tearing (some drivers hold that to twice the refresh rate).
vsync=1
# With vsync=0: 1 shows each frame at once, tearing allowed: the least input delay (EG_TEARING).
tearing=0
# Not used by Everybody's Golf: the game runs at 30 or 60 FPS by itself (see frame_rate_priority)
# and the display stays at 60 Hz (EG_FRAME_RATE).
frame_rate=60
# Console mode (EG_RENDER_RESOLUTION; next start): 4k runs the game in PS4 Pro mode, which 60 FPS
# mode (frame_rate_priority) and render_height need; 1080p runs it as on a base PS4 (30 FPS).
render_resolution=4k
# Sharpening (EG_SHARPENING): 1 (default) runs AMD FSR 1: EASU upscales the picture to the
# window's size when the window is larger, then RCAS sharpens it, for crisper edges without halos;
# 0 shows it as filtered. Also in the Display Settings panel (F10), where it applies at once, and
# on F9, which switches it over the game to compare.
sharpening=1
# RCAS strength: soft, default or strong (EG_SHARPENING_STRENGTH). No effect with sharpening=0.
sharpening_strength=default
# Anisotropic filtering of the game's textures: off (the game's own), 4, 8 or 16 (EG_ANISOTROPY).
# Keeps fairways and greens sharp at a slant.
anisotropy=off
# High-res texture detail: auto picks sharper texture levels when the render size is above 1080
# lines (half a level from 1620 up); it can add a little shimmer. off keeps the game's own
# (EG_TEXTURE_LOD_BIAS).
texture_lod_bias=off
# Anti-aliasing (EG_SMAA): 1 runs SMAA 1x on the game's picture at its render size, before it
# is scaled to the window, to smooth jagged edges; 0 (default) keeps the game's own look. Also in
# the Display Settings panel, where it applies at once.
smaa=0
# HDR (EG_HDR; next start): 1 offers the game an HDR10 (BT.2020 PQ) display, and the game
# switches its own output to HDR. Needs a display with HDR on (Windows: Use HDR); without one the
# game stays SDR.
hdr=0
# NVIDIA DLSS Frame Generation (EG_FRAME_GENERATION): 1 adds a generated frame between each two of
# the game's, on GeForce RTX 40 and 50 series cards, when the release includes the Streamline DLLs.
# Turning it on applies at the next start; off applies at once.
frame_generation=0
# Speakers: auto, stereo, 5.1, 7.1 (EG_AUDIO_CHANNELS).
audio_channels=auto
# Master volume of the game audio, 0 to 100 percent (EG_AUDIO_VOLUME). 100 is the game's own level; the
# scale is squared, so 50 is -12 dB.
audio_volume=100
# Intro (EG_SKIP_INTRO): 1 (default) skips the start-up logos and goes to the main menu. The command
# line flags are --skip-intro and --play-intro.
skip_intro=1
# 1 (default): the game's display option is held at frame rate priority, its 60 FPS mode, in every
# scene; 0 leaves the option to the game's menu (EG_FRAME_RATE_PRIORITY; next start). Needs
# render_resolution=4k.
frame_rate_priority=1
# In PS4 Pro mode (render_resolution=4k): the height the game renders its scene at, 16:9: 1080,
# 1440, 1800, 2160 (3840x2160) or 2880; 0 (default) leaves it to the game: 1920x1080 at 60 FPS,
# 3200x1800 at 30. Above 1800 the runtime gives the game more PS4 memory (EG_RENDER_HEIGHT; next
# start). At 2160 the island holds 60 FPS and some course flyovers drop to the 40s.
render_height=0
# Texture packs: a folder of replacement PNGs (upscaled textures) to sample instead of the game's,
# and a folder the game's textures are dumped into to make one (tools/texture_pack.py). Empty
# (default): off. Use full paths (EG_TEXTURE_PACK, EG_TEXTURE_DUMP). The launcher's HD textures tab
# sets both.
texture_pack=
texture_dump=
# 1 (default): with a texture_pack set, draw it; 0 keeps the game's own textures.
hd_textures=1
# 1 (default): Back (Circle, B, Esc) on the title screen ("Press X to start") asks whether to
# close the game; 0 leaves Back to the game, which ignores it there (EG_TITLE_BACK_EXITS).
title_back_exits=1

# Controls (src/runtime_pad.c). Keyboard rebinding: key_<button>=Key[,Key...] replaces that button's
# keys; SDL key names ("Space", "Left Shift", "Return", "F5"); "none" unbinds. Buttons: cross circle
# square triangle l1 r1 l2 r2 l3 r3 options touchpad up down left right lstick_up lstick_down
# lstick_left lstick_right rstick_up rstick_down rstick_left rstick_right. Env: RESOGUN_KEY_CROSS etc.
# Defaults: WASD left stick, IJKL right stick, arrows d-pad, Space/Enter Cross, Esc/Backspace Circle.
#key_cross=Space,Return
#key_touchpad=T
# Gamepad feel (defaults = raw, unchanged): stick dead zone 0..50 and rim zone 0..40 in percent (try 6 and 2), trigger press point (1..254), rumble 0..100,
# and Cross/Circle swapped for pads you hold the other way.
#pad_deadzone=0
#pad_outer_zone=0
#pad_trigger_threshold=30
#rumble_strength=100
#pad_swap_cross_circle=0
